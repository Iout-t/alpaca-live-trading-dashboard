services:
  - type: web
    name: alpaca-live-trading-control-center
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        value: "false"
      - key: TRADING_MODE
        value: LIVE
      - key: ENABLE_LIVE_ORDERS
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: EMERGENCY_STOP
        value: "true"
      - key: MAX_ORDER_NOTIONAL
        value: "100"
      - key: MAX_OPEN_POSITIONS
        value: "3"
      - key: MAX_TRADES_PER_DAY
        value: "3"
